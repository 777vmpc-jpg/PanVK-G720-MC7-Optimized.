name: Check Faux123 1.1.9 G720 MC7 port patch
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-g720-register-patch.yml"
      - "docs/FAUX123-1.1.9-G720-MC7-PORT-AUDIT.md"
      - "patches/0002-fix-provoking-vertex-fn-address-truncation.patch"

permissions:
  contents: read

jobs:
  patch-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fetch exact Mesa base
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://gitlab.freedesktop.org/mesa/mesa.git mesa
          git -C mesa fetch --depth=1 origin 5a07217f034b3e50d8c7c7794f97a2df1742613b
          git -C mesa checkout --detach FETCH_HEAD
          test "$(git -C mesa rev-parse HEAD)" = "5a07217f034b3e50d8c7c7794f97a2df1742613b"

      - name: Check G720 CSF register-count patch
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/wonderkast02/panvk-g720-kbase-csf/d9cbb91e5df720f0a62c4b5010d96c327aec315f/patches/0001-panvk-kbase-g720-register-count.patch \
            -o /tmp/g720-register-count.patch
          git -C mesa apply --check /tmp/g720-register-count.patch
          echo "REGISTER_COUNT_PATCH_APPLIES=1" | tee patch-check-result.txt
          sha256sum /tmp/g720-register-count.patch | tee -a patch-check-result.txt
          git -C mesa status --short

      - name: Check 64-bit provoking-vertex function address fix
        shell: bash
        run: |
          set -euxo pipefail
          git -C mesa apply --check "$GITHUB_WORKSPACE/patches/0002-fix-provoking-vertex-fn-address-truncation.patch"
          echo "FN_ADDR_64BIT_PATCH_APPLIES=1" | tee -a patch-check-result.txt
          sha256sum "$GITHUB_WORKSPACE/patches/0002-fix-provoking-vertex-fn-address-truncation.patch" | tee -a patch-check-result.txt
          git -C mesa status --short

      - name: Upload patch-check report
        uses: actions/upload-artifact@v4
        with:
          name: faux123-1.1.9-g720-patch-check
          path: patch-check-result.txt
          if-no-files-found: error

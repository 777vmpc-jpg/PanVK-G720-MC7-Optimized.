name: Build PanVK G720 MC7 ARM64

on:
  workflow_dispatch:
  push:
    branches: [panvk/mc7-integration]
    paths:
      - .github/workflows/build-g720-mc7.yml
      - PORTING/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison pkg-config glslang-tools libdrm-dev libexpat1-dev \
            llvm-18-dev clang-18 libclang-18-dev libclang-common-18-dev libclang-cpp18-dev libllvmspirvlib-18-dev libclc-18-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-dri3-dev \
            libxext-dev libxcb-render0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-present-dev libxshmfence-dev
          python3 -m pip install --user --break-system-packages meson ninja mako packaging pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Fetch pinned Mesa build scripts and Faux123 reference
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/zenithblue-oss/panvk-kbase-android/cf70e02b918e1864cbcd746a7fefa57b96c673ce
          mkdir -p source/meson source/scripts
          for file in meson/android-aarch64.ini scripts/bootstrap-host-tools.sh scripts/build-android-deps.sh scripts/prepare-x11-headers.sh scripts/build-android.sh; do
            curl -fLsS --retry 3 "$base/$file" -o "source/$file"
          done
          chmod +x source/scripts/*.sh
          sed -i 's/aarch64-linux-android35-clang++/aarch64-linux-android29-clang++/' source/meson/android-aarch64.ini
          curl -fLsS --retry 3 https://github.com/faux123/panvk-faux123-driver-rp4pro/releases/download/v1.1.9/panvk_faux123_v1.1.9.adpkg.zip -o faux123-original.zip
          echo 'b611ea3217b28b8e965cd6ecfc622f0fef59f00c19ea1b417092e13c23038630  faux123-original.zip' | sha256sum -c
      - name: Integrate Mesa, Kbase and MC7 changes
        run: bash PORTING/scripts/prepare-mc7.sh
      - name: Build Android ARM64 library
        env:
          PANVK_JOBS: 4
        run: MESA="$PWD/source/work/mesa" source/scripts/build-android.sh --profile g720-v12-csf --api 29 --ndk "$ANDROID_NDK_ROOT"
      - name: Verify and package ARM64 driver
        run: bash PORTING/scripts/package-mc7.sh source/dist/android-g720-v12-csf/libvulkan_panfrost.so faux123-original.zip
      - uses: actions/upload-artifact@v4
        with:
          name: panvk-faux123-1.1.9-g720-mc7-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/elf-*.txt
          if-no-files-found: error
